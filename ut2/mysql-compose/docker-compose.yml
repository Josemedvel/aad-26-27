services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_USER: jose
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
    volumes:
        - data:/var/lib/mysql

volumes:
  data:
